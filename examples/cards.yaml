type: vertical-stack
cards:
  - type: custom:alx-heating-history-card
    title: Heating history
    default_scale: day
    temperature_controls: false # explicitly opt in to native target actions
    series:
      - kind: actual_temperature
        entity: climate.example_zone_a
        label: Zone A
      - kind: target_temperature
        entity: climate.example_zone_a
        label: Target
      - kind: actual_temperature
        entity: climate.example_zone_b
        label: Zone B
      - kind: target_temperature
        entity: climate.example_zone_b
        label: Target
      - kind: heating_request
        entity: climate.example_zone_b
        label: Heat
      - kind: heating_request
        entity: climate.example_zone_a
        label: Heat
      - kind: outdoor_temperature
        entity: sensor.example_outdoor_temperature
        label: Out
      - kind: precipitation_estimate
        entity: sensor.example_precipitation_estimate
        label: Rain
  - type: custom:alx-timed-away-card
    title: Away
    start_action: script.example_apply_timed_away
    cancel_action: script.example_cancel_timed_away
    mode_entity: sensor.example_away_control
    mode_attribute: mode
    ends_at_entity: timer.example_timed_away
    ends_at_attribute: finishes_at
    duration_field: duration_minutes
  # Optional pause terminology, sharing the authoritative mode and timer.
  - type: custom:alx-timed-away-card
    intent: pause
    start_action: script.example_apply_timed_pause
    cancel_action: script.example_cancel_timed_away
    mode_entity: sensor.example_away_control
    mode_attribute: mode
    ends_at_entity: timer.example_timed_away
    ends_at_attribute: finishes_at
    duration:
      min_minutes: 1
      max_minutes: 2880
      presets: [15, 30, 60, 120]
      default_minutes: 60
  - type: custom:alx-pc-power-card
    title: Desk PC
    power_entity: switch.example_pc
    timer_entity: timer.example_pc_shutdown
    presets: [15, 30, 60]

  - type: custom:alx-light-row-card
    entity: light.example_zone_a_group
    name: Zone A
    group: true
    scene_entity: select.example_zone_a_scene
    cards:
      - type: custom:alx-light-row-card
        entity: light.example_zone_a_light_a
        name: Light A
      - type: custom:alx-light-row-card
        entity: light.example_zone_a_light_c
        name: Light C

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Full-range white tone</title>
<style>

</style><main><h1>White tone</h1><p>Existing Bubble row · full hardware range · fictional fixture</p><div id="row"></div><p class="endpoints"><span>Cool · 6535 K</span><span>Warm · 2000 K</span></p><p id="scale-description">White tone uses a reciprocal scale: warm whites get more space, while both ends remain available.</p></main>
<script type="module">
class Icon extends HTMLElement{static get observedAttributes(){return ['icon']}attributeChangedCallback(){const v=this.getAttribute('icon');this.textContent=v==='mdi:close'?'×':v==='mdi:thermometer'?'♨':v==='mdi:palette'?'◉':'◌'}set icon(v){this.setAttribute('icon',v)}set stateObj(v){this.icon=v?.attributes.icon||'mdi:lightbulb'}}

await import('/dist/alx-home-widgets.js'); await import('/.cache/fixtures/bubble-card.js');
const entity='light.example_zone_a_light_a';
let state={entity_id:entity,state:'on',attributes:{friendly_name:'Ceiling',supported_color_modes:['color_temp','xy'],color_mode:'color_temp',brightness:66,color_temp_kelvin:2700,min_color_temp_kelvin:2000,max_color_temp_kelvin:6535,hs_color:[30,90]}};

const card=document.createElement('bubble-card');
card.setConfig({type:'custom:bubble-card',card_type:'button',button_type:'slider',card_layout:'normal',rows:1,entity,name:'Ceiling · 26%',state_content:[],scrolling_effect:false,light_slider_type:'brightness',slider_live_update:false,slider_value_position:'right',...(before?{}:{min_value:0.4,max_value:100,step:0.1,allow_light_slider_to_0:true}),tap_action:{action:'toggle'},hold_action:{action:'none'},double_tap_action:{action:'none'},sub_button:{main:[{name:'White temperature',icon:'mdi:thermometer',sub_button_type:'slider',light_slider_type:'white_temp',show_name:false,show_icon:true,slider_live_update:false},{name:'Hue',icon:'mdi:palette',sub_button_type:'slider',light_slider_type:'hue',show_name:false,show_icon:true}]},styles:before?'':'${window.ALXHomeWidgets.installWhiteTone(card, hass, entity)}'});
document.querySelector('#row').append(card); card.hass=hass;
window.previewWhiteState=(attributes={},power='on')=>{state={...state,state:power,attributes:{...state.attributes,...attributes}};hass={...hass,states:{[entity]:state}};card.hass=hass};
</script></html>

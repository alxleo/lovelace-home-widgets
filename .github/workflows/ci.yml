name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - name: Detect Markdown-only changes
        id: markdown-scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --name-only --no-renames HEAD^1 HEAD -- . ':(exclude,icase,glob)**/*.md' | awk 'END { print "markdown_only=" (NR == 0) }' >> "$GITHUB_OUTPUT"
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966 # v4
        with:
          node-version: 24
          cache: npm
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npm ci
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npm run typecheck
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npm run test
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npm audit --audit-level=moderate
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npm run build
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npm run verify:dist
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npm run privacy
      - run: npm run privacy:private
        if: ${{ steps.markdown-scope.outputs.markdown_only != '1' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          ALX_PRIVACY_TERMS_B64: ${{ secrets.ALX_PRIVACY_TERMS_B64 }}
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npx playwright install --with-deps chromium
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npm run test:e2e
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npm run visual:contract
      - if: steps.markdown-scope.outputs.markdown_only != '1'
        run: npm run privacy:artifacts

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin
          comment: false

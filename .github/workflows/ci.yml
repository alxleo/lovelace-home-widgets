name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm audit
      - run: npm run build
      - run: npm run verify:dist
      - run: npm run privacy
      - run: npm run privacy:private
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ALX_PRIVACY_TERMS_B64: ${{ secrets.ALX_PRIVACY_TERMS_B64 }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run visual:contract
      - run: npm run privacy:artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: mobile-visual-contract
          path: |
            artifacts/screenshots/
            artifacts/visual-contract.json
          if-no-files-found: error

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: plugin
          comment: false
